<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Professional MarketView360 Icon -->
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="16" cy="16" r="16" fill="url(#bgGradient)"/>

  <!-- Chart line going up (bullish trend) -->
  <path d="M6 20 L10 16 L14 18 L18 12 L22 14 L26 8"
        stroke="url(#chartGradient)"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Data point circles -->
  <circle cx="10" cy="16" r="1.5" fill="#ffffff"/>
  <circle cx="18" cy="12" r="1.5" fill="#ffffff"/>
  <circle cx="26" cy="8" r="1.5" fill="#ffffff"/>

  <!-- Small upward arrow at the end -->
  <path d="M24 6 L26 8 L24 10"
        stroke="#ffffff"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
